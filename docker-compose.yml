x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment:
    POSTGRES_USER: "${POSTGRES_USER:-sepa}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
    POSTGRES_DB: "${POSTGRES_DB:-sepa_pipeline}"
    AIRFLOW_ADMIN_USER: "${AIRFLOW_ADMIN_USER:-admin}"
    AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-sepa}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-sepa_pipeline}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: "30"
    AIRFLOW__SCHEDULER__LOCAL_TASK_JOB_HEARTBEAT_SEC: "30"
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas>=2.2 psycopg2-binary>=2.9 structlog>=24.0 requests>=2.32"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./models:/opt/airflow/models
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-sepa}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-sepa_pipeline}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sepa} -d ${POSTGRES_DB:-sepa_pipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER:-sepa}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-sepa_pipeline}"
    volumes:
      - ./db:/db:ro
    command: ["/bin/sh", "/db/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER:-admin} \
          --password $${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        airflow connections add postgres_default \
          --conn-type postgres \
          --conn-host postgres \
          --conn-port 5432 \
          --conn-login $${POSTGRES_USER} \
          --conn-password $${POSTGRES_PASSWORD} \
          --conn-schema $${POSTGRES_DB} || true
        airflow variables set sepa_raw_dir /opt/airflow/data
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: "${POSTGRES_USER:-sepa}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-sepa_pipeline}"
    volumes:
      - ./api:/app/api
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: node:22-alpine
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./web:/app
    working_dir: /app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
