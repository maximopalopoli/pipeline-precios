name: CI

on:
  push:
    paths:
      - "etl/**"
      - "models/**"
      - "tests/**"
      - "db/**"
      - "api/**"
      - "dags/**"
      - "web/src/**"
      - "web/package*.json"
      - "web/tsconfig*.json"
      - "web/vite.config.*"
      - "pyproject.toml"
      - "Makefile"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test PYTEST_ARGS="--postgresql-exec=/usr/lib/postgresql/16/bin/pg_ctl -v"

      - name: Lint Python
        run: make lint

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      - name: Apply migrations twice and validate the schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        run: |
          sh db/run-migrations.sh
          sh db/run-migrations.sh
          expected_migrations="$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host="$POSTGRES_HOST" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command "SELECT 1 / CASE WHEN (SELECT COUNT(*) FROM schema_migrations) = $expected_migrations AND (SELECT COUNT(*) FROM dim_fecha) = 365 AND (SELECT COUNT(*) FROM dim_provincia) = 24 THEN 1 ELSE 0 END;"

      - name: Baseline checksums for an existing installation
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host="$POSTGRES_HOST" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command "ALTER TABLE schema_migrations DROP COLUMN checksum;"
          sh db/run-migrations.sh
          expected_migrations="$(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          PGPASSWORD="$POSTGRES_PASSWORD" psql --host="$POSTGRES_HOST" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --command "SELECT 1 / CASE WHEN (SELECT COUNT(*) FROM schema_migrations WHERE checksum IS NOT NULL) = $expected_migrations THEN 1 ELSE 0 END;"

      - name: Reject a changed applied migration
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        run: |
          printf '\n-- CI checksum verification fixture\n' >> db/migrations/001_create_metadata.sql
          if sh db/run-migrations.sh; then
            echo "Expected the migration checksum verification to fail."
            exit 1
          fi

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --tag pipeline-precios-api:ci .

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check & build
        working-directory: web
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint
