name: CI

on:
  push:
    paths:
      - "etl/**"
      - "models/**"
      - "tests/**"
      - "db/migrations/**"
      - "api/**"
      - "dags/**"
      - "pyproject.toml"
      - "Makefile"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test PYTEST_ARGS="--postgresql-exec=/usr/lib/postgresql/16/bin/pg_ctl -v"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check & build
        working-directory: web
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint
