[project]
name = "pipeline-precios"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "requests==2.32.5",
    "geopy==2.4.1",
    "structlog==25.5.0",
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "asyncpg==0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-postgresql==8.0.0",
]

[tool.setuptools.packages.find]
include = ["etl*", "models*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
